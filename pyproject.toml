[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "archmap"
dynamic = ["version"]
description = "Static architectural analysis and visualization for software codebases."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kaua Gabriel" }]
keywords = ["archmap", "architecture", "dependency-graph", "static-analysis", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.11.0"]
docs = ["mkdocs-material>=9.5"]
release = ["build>=1.2.2", "twine>=6.1.0"]

[project.urls]
Homepage = "https://github.com/Kaua-KGzin/ArchMAP"
Repository = "https://github.com/Kaua-KGzin/ArchMAP"
Documentation = "https://kaua-kgzin.github.io/ArchMAP/"
Issues = "https://github.com/Kaua-KGzin/ArchMAP/issues"
Changelog = "https://github.com/Kaua-KGzin/ArchMAP/blob/main/CHANGELOG.md"

[project.scripts]
archmap = "archmap.cli.main:main"
code-arch = "archmap.cli.main:main"

[tool.hatch.version]
path = "src/archmap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/archmap"]

[tool.hatch.build.targets.wheel.shared-data]
"src/archmap/web-ui/static" = "archmap/web-ui/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=archmap --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["examples/sample-project"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
