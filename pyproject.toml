[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "KG-ARCHMAP"
dynamic = ["version"]
description = "Static architecture analysis and visualization for software projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kaua Gabriel" }]
keywords = ["archmap", "architecture", "dependency-graph", "static-analysis", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.11.0", "mypy>=1.10.0", "pip-audit>=2.7.0"]
docs = ["mkdocs-material>=9.5"]
completion = ["argcomplete>=3.0"]
tree-sitter = [
    "tree-sitter>=0.24.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.scripts]
archmap = "archmap.cli.main:main"
code-arch = "archmap.cli.main:main"
archmap-check = "archmap.cli.check:main"

[tool.hatch.version]
path = "src/archmap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/archmap"]

[tool.hatch.build.targets.wheel.shared-data]
"src/archmap/web-ui/static" = "archmap/web-ui/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=archmap --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["examples/sample-project"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
