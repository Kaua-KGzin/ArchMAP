site_name: ArchMAP
site_description: Static architecture analysis and visualization for any codebase — dependency graphs, cycle detection, risk scoring, LLM advisor.
site_url: https://kaua-kgzin.github.io/ArchMAP/
repo_url: https://github.com/Kaua-KGzin/ArchMAP
repo_name: Kaua-KGzin/ArchMAP
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-nav.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Live Demo: getting-started/demo.md
  - CLI Reference:
      - analyze: cli/analyze.md
      - explain: cli/explain.md
      - risk: cli/risk.md
      - improve: cli/improve.md
      - serve: cli/serve.md
      - diff: cli/diff.md
      - trace: cli/trace.md
      - init: cli/init.md
      - advise: cli/advise.md
      - temporal: cli/temporal.md
      - mcp: cli/mcp.md
      - watch: cli/watch.md
  - Internals:
      - Architecture: architecture.md
      - API Reference: api.md
      - Migration Notes: MIGRATION_TO_PYTHON.md
  - Governance:
      - Branching Strategy: BRANCHING.md
      - Contributing Guide: contributing.md
      - Code of Conduct: code-of-conduct.md
      - Original Distribution Notice: notice.md
  - Operations:
      - Logging and Artifacts: operations/logging.md
  - Project:
      - Changelog: changelog.md
      - Roadmap: roadmap.md

plugins:
  - search

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kaua-KGzin/ArchMAP
      name: ArchMAP on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/KG-ARCHMAP/
      name: ArchMAP on PyPI
