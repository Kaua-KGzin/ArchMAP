name: "ArchMAP Architecture Analysis"
description: "Analyze your codebase architecture with ArchMAP — cycles, risks, and layer violations."
author: "KGzin"

branding:
  icon: "git-branch"
  color: "blue"

inputs:
  path:
    description: "Path to the project to analyze (relative to repo root)."
    required: false
    default: "."

  python-version:
    description: "Python version to use."
    required: false
    default: "3.13"

  archmap-version:
    description: "KG-ARCHMAP version to install from PyPI (e.g. '1.4.1'). Defaults to latest."
    required: false
    default: ""

  format:
    description: "Output format: json, mermaid, or both."
    required: false
    default: "json"

  out:
    description: "Path for the JSON output file."
    required: false
    default: ".codeatlas/graph.json"

  sarif:
    description: "Export SARIF and upload to GitHub Code Scanning (true/false)."
    required: false
    default: "false"

  sarif-path:
    description: "Path for the SARIF output file."
    required: false
    default: ".codeatlas/archmap.sarif"

  fail-on-cycles:
    description: "Fail the workflow if any circular dependency is detected."
    required: false
    default: "false"

  fail-on-god-modules:
    description: "Fail the workflow if any god module is detected."
    required: false
    default: "false"

  fail-on-explosions:
    description: "Fail the workflow if any dependency explosion is detected."
    required: false
    default: "false"

  fail-on-custom-rules:
    description: "Fail the workflow if custom architecture rules are violated."
    required: false
    default: "false"

  min-health:
    description: "Minimum health score (0–100). Workflow fails if score is below this value."
    required: false
    default: "0"

  quiet:
    description: "Suppress banner and insights output."
    required: false
    default: "false"

outputs:
  json-path:
    description: "Absolute path to the generated JSON report."
    value: ${{ steps.analyze.outputs.json-path }}

  sarif-path:
    description: "Absolute path to the generated SARIF file (empty if sarif is false)."
    value: ${{ steps.analyze.outputs.sarif-path }}

  health-score:
    description: "Architecture health score (0–100); empty if the report could not be read."
    value: ${{ steps.analyze.outputs.health-score }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ArchMAP
      shell: bash
      env:
        ARCHMAP_VERSION: ${{ inputs.archmap-version }}
      run: |
        # The PyPI distribution is KG-ARCHMAP; "archmap" on PyPI is an unrelated project.
        if [ -n "$ARCHMAP_VERSION" ]; then
          python -m pip install "KG-ARCHMAP==${ARCHMAP_VERSION}" --quiet
        else
          python -m pip install KG-ARCHMAP --quiet
        fi

    - name: Run analysis
      id: analyze
      shell: bash
      env:
        CI: "true"
        IN_PATH: ${{ inputs.path }}
        IN_FORMAT: ${{ inputs.format }}
        IN_OUT: ${{ inputs.out }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_SARIF_PATH: ${{ inputs.sarif-path }}
        IN_FAIL_ON_CYCLES: ${{ inputs.fail-on-cycles }}
        IN_FAIL_ON_GOD_MODULES: ${{ inputs.fail-on-god-modules }}
        IN_FAIL_ON_EXPLOSIONS: ${{ inputs.fail-on-explosions }}
        IN_FAIL_ON_CUSTOM_RULES: ${{ inputs.fail-on-custom-rules }}
        IN_MIN_HEALTH: ${{ inputs.min-health }}
        IN_QUIET: ${{ inputs.quiet }}
      run: |
        # Inputs are read from env (never interpolated into the script) to avoid
        # shell injection; arguments are collected in an array to keep quoting.
        ARGS=(--format "$IN_FORMAT" --out "$IN_OUT")
        [ "$IN_FAIL_ON_CYCLES" = "true" ] && ARGS+=(--fail-on-cycles)
        [ "$IN_FAIL_ON_GOD_MODULES" = "true" ] && ARGS+=(--fail-on-god-modules)
        [ "$IN_FAIL_ON_EXPLOSIONS" = "true" ] && ARGS+=(--fail-on-dependency-explosions)
        [ "$IN_FAIL_ON_CUSTOM_RULES" = "true" ] && ARGS+=(--fail-on-custom-rules)
        [ "$IN_MIN_HEALTH" != "0" ] && ARGS+=(--min-health "$IN_MIN_HEALTH")
        [ "$IN_QUIET" = "true" ] && ARGS+=(--quiet)
        [ "$IN_SARIF" = "true" ] && ARGS+=(--sarif --out-sarif "$IN_SARIF_PATH")

        # Record the exit code so outputs are still written when a gate fails.
        set +e
        python -m archmap.cli.main analyze "$IN_PATH" "${ARGS[@]}"
        STATUS=$?
        set -e

        echo "json-path=$(realpath "$IN_OUT" 2>/dev/null || echo "")" >> "$GITHUB_OUTPUT"
        if [ "$IN_SARIF" = "true" ]; then
          echo "sarif-path=$(realpath "$IN_SARIF_PATH" 2>/dev/null || echo "")" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-path=" >> "$GITHUB_OUTPUT"
        fi

        # Extract health score from the JSON report (empty when unavailable).
        HEALTH=""
        if [ -f "$IN_OUT" ]; then
          HEALTH=$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("architecture",{}).get("health",{}).get("score",""))' "$IN_OUT" 2>/dev/null || echo "")
        fi
        echo "health-score=${HEALTH}" >> "$GITHUB_OUTPUT"

        exit "$STATUS"

    - name: Upload SARIF to GitHub Code Scanning
      # Upload even when a quality gate failed, so findings still reach Code Scanning.
      if: ${{ !cancelled() && inputs.sarif == 'true' && steps.analyze.outputs.sarif-path != '' }}
      uses: github/codeql-action/upload-sarif@v4.37.4
      with:
        sarif_file: ${{ inputs.sarif-path }}
        category: archmap
