name: "ArchMAP Architecture Analysis"
description: "Analyze your codebase architecture with ArchMAP — cycles, risks, and layer violations."
author: "KGzin"

branding:
  icon: "git-branch"
  color: "blue"

inputs:
  path:
    description: "Path to the project to analyze (relative to repo root)."
    required: false
    default: "."

  python-version:
    description: "Python version to use."
    required: false
    default: "3.13"

  archmap-version:
    description: "KG-ARCHMAP version to install from PyPI (e.g. '1.4.1'). Defaults to latest. 'source' installs the ArchMAP source that ships with this action, so code and action always match."
    required: false
    default: ""

  format:
    description: "Output format: json, mermaid, or both."
    required: false
    default: "json"

  out:
    description: "Path for the JSON output file."
    required: false
    default: ".codeatlas/graph.json"

  sarif:
    description: "Export SARIF and upload to GitHub Code Scanning (true/false)."
    required: false
    default: "false"

  sarif-path:
    description: "Path for the SARIF output file."
    required: false
    default: ".codeatlas/archmap.sarif"

  fail-on-cycles:
    description: "Fail the workflow if any circular dependency is detected."
    required: false
    default: "false"

  fail-on-god-modules:
    description: "Fail the workflow if any god module is detected."
    required: false
    default: "false"

  fail-on-explosions:
    description: "Fail the workflow if any dependency explosion is detected."
    required: false
    default: "false"

  fail-on-custom-rules:
    description: "Fail the workflow if custom architecture rules are violated."
    required: false
    default: "false"

  min-health:
    description: "Minimum health score (0–100). Workflow fails if score is below this value."
    required: false
    default: "0"

  quiet:
    description: "Suppress banner and insights output."
    required: false
    default: "false"

  comment:
    description: "On pull_request events, post (and keep updating) one PR comment with the architecture delta against the base branch. Needs 'pull-requests: write'. Fork and Dependabot PRs get the report in the job summary only."
    required: false
    default: "false"

  github-token:
    description: "Token used to post the PR comment."
    required: false
    default: ${{ github.token }}

outputs:
  json-path:
    description: "Absolute path to the generated JSON report."
    value: ${{ steps.analyze.outputs.json-path }}

  sarif-path:
    description: "Absolute path to the generated SARIF file (empty if sarif is false)."
    value: ${{ steps.analyze.outputs.sarif-path }}

  health-score:
    description: "Architecture health score (0–100); empty if the report could not be read."
    value: ${{ steps.analyze.outputs.health-score }}

  pr-report-path:
    description: "Absolute path to the rendered PR report (Markdown); empty unless 'comment' ran."
    value: ${{ steps.pr-report.outputs.pr-report-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ArchMAP
      shell: bash
      env:
        ARCHMAP_VERSION: ${{ inputs.archmap-version }}
      run: |
        # The PyPI distribution is KG-ARCHMAP; "archmap" on PyPI is an unrelated project.
        if [ "$ARCHMAP_VERSION" = "source" ]; then
          python -m pip install "$GITHUB_ACTION_PATH" --quiet
        elif [ -n "$ARCHMAP_VERSION" ]; then
          python -m pip install "KG-ARCHMAP==${ARCHMAP_VERSION}" --quiet
        else
          python -m pip install KG-ARCHMAP --quiet
        fi

    - name: Run analysis
      id: analyze
      shell: bash
      env:
        CI: "true"
        IN_PATH: ${{ inputs.path }}
        IN_FORMAT: ${{ inputs.format }}
        IN_OUT: ${{ inputs.out }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_SARIF_PATH: ${{ inputs.sarif-path }}
        IN_FAIL_ON_CYCLES: ${{ inputs.fail-on-cycles }}
        IN_FAIL_ON_GOD_MODULES: ${{ inputs.fail-on-god-modules }}
        IN_FAIL_ON_EXPLOSIONS: ${{ inputs.fail-on-explosions }}
        IN_FAIL_ON_CUSTOM_RULES: ${{ inputs.fail-on-custom-rules }}
        IN_MIN_HEALTH: ${{ inputs.min-health }}
        IN_QUIET: ${{ inputs.quiet }}
      run: |
        # Inputs are read from env (never interpolated into the script) to avoid
        # shell injection; arguments are collected in an array to keep quoting.
        ARGS=(--format "$IN_FORMAT" --out "$IN_OUT")
        [ "$IN_FAIL_ON_CYCLES" = "true" ] && ARGS+=(--fail-on-cycles)
        [ "$IN_FAIL_ON_GOD_MODULES" = "true" ] && ARGS+=(--fail-on-god-modules)
        [ "$IN_FAIL_ON_EXPLOSIONS" = "true" ] && ARGS+=(--fail-on-dependency-explosions)
        [ "$IN_FAIL_ON_CUSTOM_RULES" = "true" ] && ARGS+=(--fail-on-custom-rules)
        [ "$IN_MIN_HEALTH" != "0" ] && ARGS+=(--min-health "$IN_MIN_HEALTH")
        [ "$IN_QUIET" = "true" ] && ARGS+=(--quiet)
        [ "$IN_SARIF" = "true" ] && ARGS+=(--sarif --out-sarif "$IN_SARIF_PATH")

        # Record the exit code so outputs are still written when a gate fails.
        set +e
        python -m archmap.cli.main analyze "$IN_PATH" "${ARGS[@]}"
        STATUS=$?
        set -e

        echo "json-path=$(realpath "$IN_OUT" 2>/dev/null || echo "")" >> "$GITHUB_OUTPUT"
        if [ "$IN_SARIF" = "true" ]; then
          echo "sarif-path=$(realpath "$IN_SARIF_PATH" 2>/dev/null || echo "")" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-path=" >> "$GITHUB_OUTPUT"
        fi

        # Extract health score from the JSON report (empty when unavailable).
        HEALTH=""
        if [ -f "$IN_OUT" ]; then
          HEALTH=$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("architecture",{}).get("health",{}).get("score",""))' "$IN_OUT" 2>/dev/null || echo "")
        fi
        echo "health-score=${HEALTH}" >> "$GITHUB_OUTPUT"

        exit "$STATUS"

    - name: PR report
      id: pr-report
      # Runs even when a quality gate failed the analysis step: that is when the
      # delta matters most. It never fails the job (posting can be forbidden).
      if: ${{ !cancelled() && inputs.comment == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_OUT: ${{ inputs.out }}
        IN_FORMAT: ${{ inputs.format }}
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        echo "pr-report-path=" >> "$GITHUB_OUTPUT"
        if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$PR_NUMBER" ]; then
          echo "::notice::ArchMAP PR report runs on pull_request events only; skipped."
          exit 0
        fi

        MARKER='<!-- archmap:pr-report -->'
        WORK="$RUNNER_TEMP/archmap-pr"
        BASE_DIR="$WORK/base-tree"
        rm -rf "$WORK" && mkdir -p "$WORK"
        BASE_JSON="$WORK/${BASE_SHA:0:7}.json"
        HEAD_JSON="$WORK/${HEAD_SHA:0:7}.json"
        REPORT="$WORK/pr-report.md"

        # Head: reuse the analysis step's JSON when it wrote one.
        if [ "$IN_FORMAT" != "mermaid" ] && [ -f "$IN_OUT" ]; then
          cp "$IN_OUT" "$HEAD_JSON"
        else
          python -m archmap.cli.main analyze "$IN_PATH" --format json --out "$HEAD_JSON" --quiet || true
        fi

        # Base: same ArchMAP version, base commit checked out next to the workspace.
        BASE_OK=false
        if git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 \
          && git worktree add --detach "$BASE_DIR" "$BASE_SHA" >/dev/null 2>&1 \
          && [ -d "$BASE_DIR/$IN_PATH" ] \
          && python -m archmap.cli.main analyze "$BASE_DIR/$IN_PATH" --format json --out "$BASE_JSON" --quiet; then
          BASE_OK=true
        fi
        git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true

        if [ "$BASE_OK" = true ] && [ -f "$HEAD_JSON" ] \
          && python -m archmap.cli.main diff --snapshot-a "$BASE_JSON" --snapshot-b "$HEAD_JSON" --format markdown --out "$REPORT"; then
          :
        else
          printf '%s\n### ArchMAP · architecture delta\n\nThe base commit (`%s`) could not be analyzed, so no delta is available for this run.\n' \
            "$MARKER" "${BASE_SHA:0:7}" > "$REPORT"
        fi

        echo "pr-report-path=$REPORT" >> "$GITHUB_OUTPUT"
        cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

        # Upsert one comment: edit the newest one this token's user wrote with the marker.
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::ArchMAP PR report: 'gh' is not installed; report is in the job summary only."
          exit 0
        fi
        ME="$(gh api user -q .login 2>/dev/null || true)"
        [ -n "$ME" ] || ME="github-actions[bot]"
        ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          -q ".[] | select(.user.login == \"$ME\" and (.body | startswith(\"$MARKER\"))) | .id" 2>/dev/null | tail -n 1)"
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$REPORT" >/dev/null 2>"$WORK/gh.err" \
            && echo "Updated PR comment $ID" \
            || echo "::warning::ArchMAP PR report could not update the comment: $(head -c 300 "$WORK/gh.err")"
        else
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$REPORT" >/dev/null 2>"$WORK/gh.err" \
            && echo "Posted PR comment" \
            || echo "::warning::ArchMAP PR report could not be posted (fork or Dependabot PRs have a read-only token): $(head -c 300 "$WORK/gh.err")"
        fi

    - name: Upload SARIF to GitHub Code Scanning
      # Upload even when a quality gate failed, so findings still reach Code Scanning.
      if: ${{ !cancelled() && inputs.sarif == 'true' && steps.analyze.outputs.sarif-path != '' }}
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ inputs.sarif-path }}
        category: archmap
