name: ci

on:
  push:
    branches:
      - main
      - feat/**
      - release/**
      - feature/**
      - fix/**
      - perf/**
      - docs/**
  pull_request:

# Só leitura: nenhum job deste workflow escreve no repositório.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .
        if: matrix.python-version == '3.13'

      - name: Type check (mypy)
        run: python -m mypy src/archmap/ --ignore-missing-imports --exclude "web-ui"
        if: matrix.python-version == '3.13'

      - name: Audit dependencies (pip-audit)
        run: pip-audit --progress-spinner off .
        if: matrix.python-version == '3.13'

      - name: Run tests with coverage
        run: python -m pytest

      - name: Run smoke analysis
        run: python -m archmap.cli.main analyze . --format both --out .codeatlas/ci-graph.json --out-mermaid .codeatlas/ci-graph.mmd --include-cytoscape --out-sarif .codeatlas/ci-archmap.sarif
        if: matrix.python-version == '3.13'

      - name: Architectural self-check (dogfooding)
        run: python -m archmap.cli.main analyze src/archmap/ --fail-on-cycles --quiet --format json --out .codeatlas/self-check.json
        if: matrix.python-version == '3.13'

  tree-sitter:
    name: Tests with tree-sitter (AST path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies (with tree-sitter extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tree-sitter]"

      - name: Run tests with coverage (tree-sitter active)
        run: python -m pytest

  build-package:
    name: Build Python package (wheel + sdist)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: pip install hatch

      - name: Build wheel and sdist
        run: hatch build

      - name: Verify wheel is importable
        run: |
          pip install dist/*.whl
          python -c "import archmap; print('archmap', archmap.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: quality
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -e ".[dev]"

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build-exe.ps1 -Clean

      - name: Smoke test EXE
        shell: pwsh
        run: ./dist/archmap.exe version

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: archmap-exe-${{ github.sha }}
          path: |
            dist/archmap.exe
            dist/archmap-build-info.json
          retention-days: 7

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t archmap:ci .

      - name: Image runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id archmap:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"

      - name: CLI works and can read a mounted project
        run: |
          docker run --rm archmap:ci version
          docker run --rm -v "$PWD/examples:/project:ro" archmap:ci analyze . --quiet --format json --out /tmp/graph.json

  pr-report-selftest:
    name: PR report self-test (composite action)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gate forced to fail: the report must still be produced and posted.
      - name: Action with a failing quality gate
        id: gated
        uses: ./
        continue-on-error: true
        with:
          archmap-version: source
          comment: "true"
          quiet: "true"
          min-health: "100"

      - name: Report exists despite the failed gate
        env:
          GATED_OUTCOME: ${{ steps.gated.outcome }}
        run: |
          grep -q 'archmap:pr-report' "$RUNNER_TEMP/archmap-pr/pr-report.md"
          test "$GATED_OUTCOME" = "failure"

      # No JSON from the analysis step: the report step analyzes the head itself.
      - name: Action with mermaid-only output
        uses: ./
        with:
          archmap-version: source
          comment: "true"
          quiet: "true"
          format: mermaid
          out: .codeatlas/selftest.mmd

      - name: Report exists without a head JSON
        run: |
          grep -q 'archmap:pr-report' "$RUNNER_TEMP/archmap-pr/pr-report.md"
          grep -q 'architecture delta' "$RUNNER_TEMP/archmap-pr/pr-report.md"
