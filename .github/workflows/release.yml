name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from archmap import __version__
          print(__version__)
          PY
          )"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match package version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Run quality gates
        run: |
          python -m ruff check .
          python -m pytest

      - name: Build distribution
        shell: bash
        run: |
          rm -rf build dist
          python -m build --sdist --wheel

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $packageVersion = (python -c "import sys; sys.path.insert(0, 'src'); from archmap import __version__; print(__version__)").Trim()
          if ($version -ne $packageVersion) {
            Write-Error "Tag version ($version) does not match package version ($packageVersion)."
            exit 1
          }

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[dev]"

      - name: Build Windows executable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./scripts/build-exe.ps1 -Clean

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/archmap.exe
            dist/archmap-*.exe
            dist/archmap-build-info.json
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build-python
      - build-windows-exe
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: Extract changelog for this release
        id: changelog
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")

          header = re.compile(rf"^## \[{re.escape(version)}\](?:\s+-\s+.*)?$", re.MULTILINE)
          match = header.search(text)
          if not match:
            notes = "See CHANGELOG.md for details."
          else:
            start = match.end()
            next_header = re.search(r"^## \[", text[start:], re.MULTILINE)
            end = start + next_header.start() if next_header else len(text)
            notes = text[start:end].strip() or "See CHANGELOG.md for details."

          pathlib.Path("release_notes.txt").write_text(notes + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"version={version}\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ArchMAP ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.txt
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python for PyPI publish
        if: ${{ secrets.PYPI_TOKEN != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m twine upload dist/*.whl dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
